<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TEALHOUSE</title>
    <meta
      name="description"
      content="Luxury vegan shoes and accessories at TEALHOUSE, featuring stylish designs made from plants and unique teal soles for eco-conscious consumers."
    />

    <!--
      Search engines are blocked until launch. Removing this single line is the
      moment the site goes live. Do not remove it until Stripe is wired up and
      the checkout can actually take payment.
    -->
    <meta name="robots" content="noindex, nofollow" />

    <!--
      Tinos, the brand typeface. This used to live as an @import at the bottom of
      globals.css, where the build stripped it, so every font-['Tinos'] on the
      site silently fell back to the browser default serif. Loading it here is
      the only reliable way. Keep the preconnects, they cut load time noticeably.
    -->
    <!--
      Site-wide Open Graph defaults. These are what Facebook, iMessage and
      Slack actually read, because those scrapers do not run JavaScript. The
      per-product tags set by the Seo component are seen by Google, which
      does. Making link previews product-specific needs prerendering.
    -->
    <meta property="og:site_name" content="TEALHOUSE" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TEALHOUSE" />
    <meta
      property="og:description"
      content="Luxury vegan shoes and accessories made from plants, with our signature teal sole."
    />
    <meta property="og:url" content="https://www.tealhouse.us" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:image" content="https://www.tealhouse.us/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:image" content="https://www.tealhouse.us/og-image.png" />

    <link rel="canonical" href="https://www.tealhouse.us" />

    <!--
      Favicons. The transparent versions sit on any browser toolbar colour;
      the Apple touch icon is deliberately opaque, because iOS renders a
      transparent home-screen icon on black.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    />

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #root {
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
